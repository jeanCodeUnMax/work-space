<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../media/panel.css">
    <title>Orchestrator Monitor</title>
</head>
<body class="">
    <div class="monitor-container">
        <!-- Banderole Hephaistos-Kit -->
        <div class="brand-banner">
            <img src="../media/hephaistos-banderole.jpg" alt="Hephaistos-Kit — The Developer's Forge" />
            <div class="brand-overlay">
                <span class="brand-title">Hephaistos Orchestrator Monitor</span>
                <span class="brand-subtitle">Extension du Hephaistos-Kit — supervision de l'orchestrateur multi-agents</span>
            </div>
        </div>

        <!-- En-tête principal -->
        <header class="monitor-header">
            <div class="header-left">
                <h1>Tâches &amp; Agents</h1>
                <div class="connection-status" id="ws-indicator" title="WebSocket">
                    <span class="status-dot disconnected" id="ws-dot"></span>
                    <span class="status-label" id="ws-status-text" data-i18n="conn.disconnected"></span>
                </div>
            </div>
            <div class="header-right">
                <span class="last-update" id="last-update-text" data-i18n="sync.waiting"></span>
                
                <div class="settings-wrap">
                    <button id="btn-settings" class="btn btn-icon-only" data-i18n-title="btn.settings" title="">&#9881;</button>
                    <div id="settings-menu" class="settings-menu hidden">
                        <div class="settings-label" data-i18n="menu.language"></div>
                        <button class="settings-item settings-lang" data-lang="fr">Français</button>
                        <button class="settings-item settings-lang" data-lang="en">English</button>
                        <button class="settings-item settings-lang" data-lang="de">Deutsch</button>
                        <button class="settings-item settings-lang" data-lang="es">Español</button>
                        <div class="settings-sep"></div>
                        <button class="settings-item" data-action="refresh" data-i18n="menu.refresh"></button>
                        <button class="settings-item" data-action="restart-bridge" data-i18n="menu.restart"></button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Cartes synthétiques (KPIs) -->
        <section class="summary-section">
            <div class="summary-card card-in-progress">
                <div class="summary-value" id="kpi-in-progress">0</div>
                <div class="summary-label" data-i18n="kpi.inprogress"></div>
            </div>
            <div class="summary-card card-pending">
                <div class="summary-value" id="kpi-pending">0</div>
                <div class="summary-label" data-i18n="kpi.pending"></div>
            </div>
            <div class="summary-card card-completed">
                <div class="summary-value" id="kpi-completed">0</div>
                <div class="summary-label" data-i18n="kpi.completed"></div>
            </div>
            <div class="summary-card card-failed">
                <div class="summary-value" id="kpi-failed">0</div>
                <div class="summary-label" data-i18n="kpi.failed"></div>
            </div>
            <div class="summary-card card-agents">
                <div class="summary-value" id="kpi-agents">0</div>
                <div class="summary-label" data-i18n="kpi.agents"></div>
            </div>
        </section>

        <!-- Section des tâches : 4 groupes dépliables -->
        <section class="tasks-section">
            <div class="section-toolbar">
                <h2><span data-i18n="tasks.title"></span> (<span id="tasks-count">0</span>)</h2>
                <div class="toolbar-filters">
                    <input type="text" id="task-search-input" class="input-search" data-i18n-ph="tasks.search" placeholder="" />
                </div>
            </div>

            <div class="task-groups" id="task-groups">

                <div class="task-group" data-status="in_progress">
                    <div class="task-group-header" role="button" tabindex="0">
                        <span class="group-chevron">&#9662;</span>
                        <span class="group-label" data-i18n="group.in_progress"></span>
                        <button class="group-action-btn" data-copy-group="in_progress" data-i18n-title="tasks.sendGroup" title="">&#8679;</button>
                        <button class="group-action-btn group-purge-btn" data-purge-group="in_progress" data-i18n-title="tasks.purgeGroup" title="">&#128465;</button>
                        <span class="group-count" id="gcount-in_progress">0</span>
                    </div>
                    <div class="task-group-body">
                        <table class="tasks-table">
                            <thead>
                                <tr>
                                    <th data-i18n="th.id"></th><th data-i18n="th.title"></th><th data-i18n="th.priority"></th>
                                    <th data-i18n="th.type"></th><th data-i18n="th.model"></th><th data-i18n="th.agent"></th>
                                    <th data-i18n="th.created"></th><th class="col-actions"></th>
                                </tr>
                            </thead>
                            <tbody id="tbody-in_progress"></tbody>
                        </table>
                    </div>
                </div>

                <div class="task-group" data-status="pending">
                    <div class="task-group-header" role="button" tabindex="0">
                        <span class="group-chevron">&#9662;</span>
                        <span class="group-label" data-i18n="group.pending"></span>
                        <button class="group-action-btn" data-copy-group="pending" data-i18n-title="tasks.sendGroup" title="">&#8679;</button>
                        <button class="group-action-btn group-purge-btn" data-purge-group="pending" data-i18n-title="tasks.purgeGroup" title="">&#128465;</button>
                        <span class="group-count" id="gcount-pending">0</span>
                    </div>
                    <div class="task-group-body">
                        <table class="tasks-table">
                            <thead>
                                <tr>
                                    <th data-i18n="th.id"></th><th data-i18n="th.title"></th><th data-i18n="th.priority"></th>
                                    <th data-i18n="th.type"></th><th data-i18n="th.model"></th><th data-i18n="th.agent"></th>
                                    <th data-i18n="th.created"></th><th class="col-actions"></th>
                                </tr>
                            </thead>
                            <tbody id="tbody-pending"></tbody>
                        </table>
                    </div>
                </div>

                <div class="task-group collapsed" data-status="failed">
                    <div class="task-group-header" role="button" tabindex="0">
                        <span class="group-chevron">&#9662;</span>
                        <span class="group-label" data-i18n="group.failed"></span>
                        <button class="group-action-btn" data-copy-group="failed" data-i18n-title="tasks.sendGroup" title="">&#8679;</button>
                        <button class="group-action-btn group-purge-btn" data-purge-group="failed" data-i18n-title="tasks.purgeGroup" title="">&#128465;</button>
                        <span class="group-count" id="gcount-failed">0</span>
                    </div>
                    <div class="task-group-body">
                        <table class="tasks-table">
                            <thead>
                                <tr>
                                    <th data-i18n="th.id"></th><th data-i18n="th.title"></th><th data-i18n="th.priority"></th>
                                    <th data-i18n="th.type"></th><th data-i18n="th.model"></th><th data-i18n="th.agent"></th>
                                    <th data-i18n="th.created"></th><th class="col-actions"></th>
                                </tr>
                            </thead>
                            <tbody id="tbody-failed"></tbody>
                        </table>
                    </div>
                </div>

                <div class="task-group collapsed" data-status="completed">
                    <div class="task-group-header" role="button" tabindex="0">
                        <span class="group-chevron">&#9662;</span>
                        <span class="group-label" data-i18n="group.completed"></span>
                        <button class="group-action-btn" data-copy-group="completed" data-i18n-title="tasks.sendGroup" title="">&#8679;</button>
                        <button class="group-action-btn group-purge-btn" data-purge-group="completed" data-i18n-title="tasks.purgeGroup" title="">&#128465;</button>
                        <span class="group-count" id="gcount-completed">0</span>
                    </div>
                    <div class="task-group-body">
                        <table class="tasks-table">
                            <thead>
                                <tr>
                                    <th data-i18n="th.id"></th><th data-i18n="th.title"></th><th data-i18n="th.priority"></th>
                                    <th data-i18n="th.type"></th><th data-i18n="th.model"></th><th data-i18n="th.agent"></th>
                                    <th data-i18n="th.created"></th><th class="col-actions"></th>
                                </tr>
                            </thead>
                            <tbody id="tbody-completed"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>

        <!-- Section des agents -->
        <section class="agents-section">
            <div class="section-toolbar">
                <h2><span data-i18n="agents.title"></span> (<span id="agents-count">0</span>)</h2>
            </div>
            <div class="agents-grid" id="agents-grid-container"></div>
        </section>
    </div>

    <script src="vscode-shim.js"></script>
    <script src="../media/i18n.js"></script>
    <script src="../media/panel.js"></script>
</body>
</html>
