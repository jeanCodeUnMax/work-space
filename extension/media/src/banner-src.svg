<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0C1524"/>
      <stop offset="70%" stop-color="#13233B"/>
      <stop offset="100%" stop-color="#16293F"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22344F"/>
      <stop offset="100%" stop-color="#101B2C"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2FA8A0"/>
      <stop offset="100%" stop-color="#C9984B"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2FA8A0" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#2FA8A0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- backdrop -->
  <rect width="1280" height="320" fill="url(#sky)"/>
  <!-- faint data stars -->
  <g fill="#3E5878">
    <circle cx="120" cy="46" r="2"/><circle cx="330" cy="30" r="1.6"/><circle cx="520" cy="60" r="2"/>
    <circle cx="700" cy="28" r="1.5"/><circle cx="880" cy="52" r="2"/><circle cx="1050" cy="34" r="1.6"/>
    <circle cx="1200" cy="66" r="2"/><circle cx="430" cy="90" r="1.4"/><circle cx="960" cy="96" r="1.6"/>
  </g>
  <!-- circuit floor -->
  <rect y="248" width="1280" height="72" fill="url(#floor)"/>
  <g stroke="#2C4A6E" stroke-width="2" opacity=".55">
    <path d="M0 262h300l24 18h200M0 288h160l30 20h240"/>
    <path d="M640 270h220l26 20h394M700 296h580"/>
  </g>
  <g fill="#2C4A6E" opacity=".6">
    <circle cx="300" cy="262" r="4"/><circle cx="524" cy="280" r="4"/><circle cx="860" cy="270" r="4"/>
    <circle cx="1086" cy="290" r="4"/><circle cx="190" cy="308" r="4"/>
  </g>

  <!-- half-buried folders -->
  <g>
    <path d="M560 252v-28h34l10 10h44v30z" fill="#3A5B80"/>
    <path d="M560 252v-16h88v16z" fill="#4F74A0"/>
    <path d="M1080 254v-24h30l9 9h38v26z" fill="#3A5B80"/>
    <path d="M1080 254v-14h77v14z" fill="#4F74A0"/>
    <path d="M330 258v-20h26l8 8h34v22z" fill="#34506F"/>
    <path d="M330 258v-11h68v11z" fill="#46648C"/>
  </g>

  <!-- ajar secret folder with glow -->
  <ellipse cx="760" cy="238" rx="60" ry="34" fill="url(#glow)"/>
  <path d="M712 250v-30h34l10 10h40v26z" fill="#4F74A0"/>
  <path d="M712 250v-14h84v14z" fill="#6C93BE"/>
  <path d="M796 226l26-14 10 20-26 12z" fill="#6C93BE"/>
  <circle cx="762" cy="240" r="7" fill="#0C1524"/>
  <rect x="760" y="240" width="4" height="10" rx="2" fill="#0C1524"/>

  <!-- digital footprints: file/folder pictogram marks -->
  <g fill="none" stroke="url(#trail)" stroke-width="3" stroke-linecap="round">
    <g transform="translate(880 268)"><rect x="-9" y="-7" width="18" height="14" rx="2"/><path d="M-9 -3h18"/></g>
    <g transform="translate(948 256)"><rect x="-7" y="-9" width="14" height="18" rx="2"/><path d="M-3 -4h8M-3 0h8M-3 4h5"/></g>
    <g transform="translate(1018 266)"><rect x="-9" y="-7" width="18" height="14" rx="2"/><path d="M-9 -3h18"/></g>
    <g transform="translate(1090 254)"><rect x="-7" y="-9" width="14" height="18" rx="2"/><path d="M-3 -4h8M-3 0h8M-3 4h5"/></g>
    <g transform="translate(1160 264)"><rect x="-9" y="-7" width="18" height="14" rx="2"/><path d="M-9 -3h18"/></g>
    <g transform="translate(1240 252)"><rect x="-7" y="-9" width="14" height="18" rx="2"/><path d="M-3 -4h8M-3 0h8M-3 4h5"/></g>
  </g>

  <!-- Sherlock silhouette -->
  <g transform="translate(620 60)">
    <!-- cape/body -->
    <path d="M40 92c-6-34 8-60 30-64 22-4 40 14 44 44l10 96c2 18-10 30-28 30H66c-20 0-32-14-30-32z" fill="#0A0F18"/>
    <!-- rim light -->
    <path d="M114 74c8 14 12 32 12 56l6 62c1 10-4 18-13 20l-6-92c-2-20-7-36-15-46z" fill="#C9984B" opacity=".85"/>
    <!-- deerstalker -->
    <path d="M44 30C44 12 58 0 78 0s34 12 34 30l-10 4c-4-14-12-22-24-22s-20 8-24 22z" fill="#0A0F18"/>
    <path d="M40 30c-12 1-22 7-28 15l20 4z" fill="#0A0F18"/>
    <path d="M116 30c12 1 22 7 28 15l-20 4z" fill="#0A0F18"/>
    <path d="M78 0 68 -12m10 12 10 -12" stroke="#0A0F18" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- brass rim on hat -->
    <path d="M112 30c12 1 22 7 28 15" stroke="#C9984B" stroke-width="3" fill="none" opacity=".9"/>
    <!-- arm + magnifier toward trail -->
    <path d="M108 120c16 10 34 18 52 24l-6 14c-18-6-36-14-52-24z" fill="#0A0F18"/>
    <circle cx="172" cy="140" r="26" fill="none" stroke="#C9984B" stroke-width="7"/>
    <circle cx="172" cy="140" r="26" fill="#2FA8A0" opacity=".18"/>
    <path d="M186 160l18 22" stroke="#5E4023" stroke-width="9" stroke-linecap="round"/>
    <!-- pipe -->
    <path d="M118 84c10-2 18 2 20 10l-7 4c-3-6-8-10-13-10z" fill="#0A0F18"/>
    <circle cx="141" cy="92" r="5" fill="#C9984B" opacity=".7"/>
  </g>
</svg>
