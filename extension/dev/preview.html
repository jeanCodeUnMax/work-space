<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/media/panel.css">
<title>Everything Search — Preview</title>
<style>
  /* preview-only chrome, not part of the webview UI */
  body { margin: 0; }
  #toolbar { position: sticky; top: 0; }
  /* fake vscode theme vars so panel.css resolves like in the IDE */
  :root {
    --vscode-font-family: 'Segoe UI', sans-serif;
    --vscode-font-size: 13px;
    --vscode-foreground: #cccccc;
    --vscode-editor-background: #1e1e1e;
    --vscode-sideBar-background: #1e1e1e;
    --vscode-sideBarSectionHeader-background: #252526;
    --vscode-input-background: #3c3c3c;
    --vscode-input-foreground: #cccccc;
    --vscode-input-border: #3c3c3c;
    --vscode-input-placeholderForeground: #a6a6a6;
    --vscode-focusBorder: #007fd4;
    --vscode-list-hoverBackground: #2a2d2e;
    --vscode-list-activeSelectionBackground: #094771;
    --vscode-list-activeSelectionForeground: #ffffff;
    --vscode-descriptionForeground: #989898;
    --vscode-button-background: #0e639c;
    --vscode-button-foreground: #ffffff;
    --vscode-menu-background: #252526;
    --vscode-menu-border: #454545;
    --vscode-menu-selectionBackground: #094771;
    --vscode-menu-selectionForeground: #ffffff;
    --vscode-panel-border: #454545;
    --vscode-editor-font-family: Consolas, 'Courier New', monospace;
  }
  html { color-scheme: dark; }
</style>
</head>
<body>
<!--PANEL_BODY-->
<script>
// Stub of the vscode webview API — proxies to serve_preview.py so the REAL
// panel.js runs against the REAL Everything index in a plain browser.
window.acquireVsCodeApi = function () {
  return {
    postMessage: function (msg) {
      if (msg.type === 'search') {
        fetch('/api/search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            query: msg.query, sort: msg.sort,
            descending: msg.descending, max_results: 500,
          }),
        })
          .then(function (r) { return r.json(); })
          .then(function (payload) {
            if (payload.error) {
              window.postMessage({ type: 'error', seq: msg.seq, message: payload.error }, '*');
            } else {
              window.postMessage({ type: 'results', seq: msg.seq, payload: payload, renderCap: 500 }, '*');
            }
          })
          .catch(function (e) {
            window.postMessage({ type: 'error', seq: msg.seq, message: String(e) }, '*');
          });
      } else if (msg.type === 'preview') {
        fetch('/api/preview', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(msg),
        })
          .then(function (r) { return r.json(); })
          .then(function (pv) { window.postMessage(Object.assign({ type: 'preview' }, pv), '*'); })
          .catch(function () {});
      } else if (msg.type === 'fsCreate') {
        fetch('/api/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(msg),
        })
          .then(function (r) { return r.json(); })
          .then(function (res) {
            window.postMessage({ type: 'fsCreated', path: res.path, error: res.ok ? null : (res.error || 'failed') }, '*');
          })
          .catch(function (e) { window.postMessage({ type: 'fsCreated', error: String(e) }, '*'); });
      } else if (msg.type === 'submitToAgent') {
        var paths = (msg.paths || []).join('\n');
        if (navigator.clipboard) navigator.clipboard.writeText(paths).catch(function () {});
        window.postMessage({ type: 'status', message: (msg.paths || []).length + ' path(s) copied — paste into agent chat (Ctrl+V)' }, '*');
      } else if (msg.type === 'copyPath') {
        if (navigator.clipboard) navigator.clipboard.writeText(msg.path).catch(function () {});
      } else if (msg.type === 'open' || msg.type === 'openContaining' || msg.type === 'reveal') {
        fetch('/api/act', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(msg),
        }).catch(function () {});
      }
    },
    getState: function () {
      try { return JSON.parse(localStorage.getItem('evPreviewState') || 'null'); }
      catch (e) { return null; }
    },
    setState: function (s) {
      try { localStorage.setItem('evPreviewState', JSON.stringify(s)); } catch (e) {}
    },
  };
};
</script>
<script src="/media/panel.js"></script>
</body>
</html>
