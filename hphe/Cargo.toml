[workspace]
members = [
    "crates/hphe-mft",
    "crates/hphe-index",
    "crates/hphe-query",
    "crates/hphe-content",
    "crates/hphe-ipc",
    "crates/hphe-usn",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Hephaistos Team"]
license = "MIT"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false
