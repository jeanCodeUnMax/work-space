[package]
name = "hphe-content"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Tantivy-backed content index (BM25 + snippets) for the Hephaistos engine - P3 component"
readme = "README.md"
keywords = ["search", "tantivy", "bm25", "content", "index"]
categories = ["text-processing", "data-structures"]

[lib]
name = "hphe_content"
path = "src/lib.rs"

[[bin]]
name = "hphe-content"
path = "src/main.rs"

[dependencies]
# BM25 + field columns content index (HNSW available since 0.22 for later vector phase)
tantivy = "0.22"

# Encoding detection (basic BOM sniffing + UTF-8/UTF-16/Latin-1 fallback)
encoding_rs = "0.8"

# Error handling
thiserror = "1.0"

# CLI
clap = { version = "4.4", features = ["derive"] }

[dev-dependencies]
# For tests
tempfile = "3"
