[package]
name = "hphe-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Unified MCP stdio server client of hphe-index named pipe (Hephaistos Engine)"

[lib]
name = "hphe_mcp"
path = "src/lib.rs"

[[bin]]
name = "hphe-mcp"
path = "src/main.rs"

[dependencies]
hphe-ipc = { path = "../hphe-ipc" }
hphe-content = { path = "../hphe-content" }
hphe-vec = { path = "../hphe-vec" }

tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.20"
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "1.0"
async-trait = "0.1"
regex = "1.10"
walkdir = "2.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = "3.10"
tokio-test = "0.4"
