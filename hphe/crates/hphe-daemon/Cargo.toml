[package]
name = "hphe-daemon"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "High-Performance NTFS Indexing Daemon (Hephaistos Engine)"

[lib]
name = "hphe_daemon"
path = "src/lib.rs"

[[bin]]
name = "hphe-indexd"
path = "src/main.rs"

[dependencies]
hphe-mft = { path = "../hphe-mft" }
hphe-index = { path = "../hphe-index" }
hphe-query = { path = "../hphe-query" }
hphe-usn = { path = "../hphe-usn" }
hphe-ipc = { path = "../hphe-ipc" }

clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
hashbrown = "0.14"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_IO",
] }

[dev-dependencies]
tempfile = "3.10"
tokio-test = "0.4"
