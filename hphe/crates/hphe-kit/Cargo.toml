[package]
name = "hphe-kit"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Hephaistos-Kit unifie : orchestration (tasks/agents/dispatch), model discovery, NIM router, agent memory, ingestion"

[dependencies]
hphe-content = { path = "../hphe-content" }
hphe-vec = { path = "../hphe-vec" }

tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.20"
tracing = "0.1"
thiserror = "1.0"
walkdir = "2.5"
regex = "1.10"
sha2 = "0.10"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
